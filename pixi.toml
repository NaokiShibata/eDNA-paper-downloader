[workspace]
name = "edna-paper-downloader"
channels = ["conda-forge", "bioconda"]
platforms = [
  { platform = "linux-64", cuda = "12.8" },
]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
requests = ">=2.32,<3"
typer = ">=0.12"
tqdm = ">=4.66"
biopython = ">=1.84"
rich = ">=13.7"
pyyaml = ">=6.0"
ruff = ">=0.6"
mypy = ">=1.15,<3"
pytorch-gpu = ">=2.7"
cuda-cudart-dev = ">=12.8,<13"

[pypi-dependencies]
pyalex = "*"
strands-decider = "*"

[tasks]
fetch = "python script/fetch.py"
serve-check = "python script/serve.py --check-only"
serve = "env CUDA_VISIBLE_DEVICES=0 llama-server -m .cache/clef/Clef-Q8_0.gguf --alias clef-27b-q8 --host 127.0.0.1 --port 8014 -ngl 99 -c 8192 -b 8192 -ub 8192 -np 1"
serve-strands = "python script/serve.py"
clef-health = """python -c "import requests; print(requests.get('http://127.0.0.1:8014/health', timeout=10).json())" """
strands-health = """python -c "import requests; print(requests.get('http://127.0.0.1:8012/health', timeout=10).json())" """
screen = "python script/screen.py"
e2e = "python script/e2e.py"
benchmark = "python script/benchmark.py"
lint = "ruff check script test"
typecheck = "mypy script test"
test = "python -m unittest discover -s test"
