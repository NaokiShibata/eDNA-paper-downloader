[workspace]
name = "edna-paper-downloader"
channels = ["conda-forge", "bioconda"]
platforms = [
  { platform = "linux-64", cuda = "12.0" },
]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
requests = ">=2.32,<3"
typer = ">=0.12"
tqdm = ">=4.66"
biopython = ">=1.84"
rich = ">=13.7"
pyyaml = ">=6.0"
matplotlib = ">=3.9"
matplotlib-venn = ">=1.1"
upsetplot = ">=0.9"
ruff = ">=0.6"
mypy = ">=1.15,<3"
pytorch-gpu = ">=2.7"

[pypi-dependencies]
pyalex = "*"
strands-decider = "*"

[tasks]
cuda-check = """python -c "import torch; print('torch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('CUDA runtime:', torch.version.cuda); print('GPU count:', torch.cuda.device_count()); [print(f'GPU {i}: {torch.cuda.get_device_name(i)}') for i in range(torch.cuda.device_count())]" """
cuda1-check = """python -c "import torch; i=1; print('selected:', f'cuda:{i}'); print('name:', torch.cuda.get_device_name(i)); free,total=torch.cuda.mem_get_info(i); print('free GiB:', round(free/1024**3,2)); print('total GiB:', round(total/1024**3,2))" """
strands-serve = "strands-decider serve StrandsAgents/strands-decider-2B-hobson-v19 --device cuda:1 --no-prefix-cache --max-batch 1 --host 127.0.0.1 --port 8012"
strands-health = """python -c "import requests; print(requests.get('http://127.0.0.1:8012/health', timeout=10).json())" """
strands-screen = "python script/strands_flagger.py"
lint = "ruff check script"
typecheck = "mypy script"
