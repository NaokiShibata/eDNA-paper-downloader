[workspace]
name = "edna-paper-downloader"
channels = ["conda-forge", "bioconda"]
platforms = [
  { platform = "linux-64", cuda = "12.8" },
]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
requests = ">=2.32,<3"
typer = ">=0.12"
tqdm = ">=4.66"
biopython = ">=1.84"
rich = ">=13.7"
pyyaml = ">=6.0"
ruff = ">=0.6"
mypy = ">=1.15,<3"
pytorch-gpu = ">=2.7"
cuda-cudart-dev = ">=12.8,<13"

[pypi-dependencies]
pyalex = "*"
strands-decider = "*"

[tasks]
cuda-check = """python -c "import torch; print('torch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('CUDA runtime:', torch.version.cuda); print('GPU count:', torch.cuda.device_count()); [print(f'GPU {i}: {torch.cuda.get_device_name(i)}') for i in range(torch.cuda.device_count())]" """
strands-device-check = "python script/strands_serve_auto.py --check-only"
strands-serve = "python script/strands_serve_auto.py"
strands-health = """python -c "import requests; print(requests.get('http://127.0.0.1:8012/health', timeout=10).json())" """
strands-screen = "python script/strands_flagger.py"
e2e-latest14 = "python script/e2e_latest14.py"
benchmark-make = "python script/make_strands_benchmark.py"
benchmark-eval = "python script/evaluate_strands_benchmark.py"
benchmark-tune = "python script/tune_strands_thresholds.py"
lint = "ruff check script"
typecheck = "mypy script"
triton-check = """python -c "import os, sys, torch, triton; print('python:', sys.version.split()[0]); print('torch:', torch.__version__); print('torch CUDA:', torch.version.cuda); print('triton:', triton.__version__); print('Python.h:', os.path.exists(os.path.join(sys.prefix, 'include', 'python3.12', 'Python.h'))); print('capability:', torch.cuda.get_device_capability(1) if torch.cuda.device_count() > 1 else torch.cuda.get_device_capability(0))" """
cuda-header-check = """python -c "import os, sys; p=os.path.join(sys.prefix, 'targets', 'x86_64-linux', 'include', 'cuda.h'); print('cuda.h:', p); print('exists:', os.path.exists(p))" """
triton-driver-check = """CUDA_VISIBLE_DEVICES=1 python -c "import ctypes; ctypes.CDLL('libcuda.so.1'); from triton.runtime import driver; print('libcuda: ok'); print('target:', driver.active.get_current_target())" """
